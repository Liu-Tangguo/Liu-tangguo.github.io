name: Build Posts JSON

on:
  push:
    branches:
      - main
    paths:
      - "content/posts/**"
      - ".github/workflows/build-posts.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build posts.json
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          posts_dir = Path("content/posts")
          output_file = Path("posts.json")

          posts = []

          if posts_dir.exists():

              for file in posts_dir.glob("*.md"):

                  text = file.read_text(
                      encoding="utf-8"
                  )

                  title = ""
                  date = ""
                  category = ""
                  body = text

                  # 读取文章 Front Matter
                  if text.startswith("---"):

                      match = re.match(
                          r"^---\s*\n(.*?)\n---\s*\n?(.*)$",
                          text,
                          re.S
                      )

                      if match:

                          front_matter = match.group(1)
                          body = match.group(2).strip()

                          for line in front_matter.splitlines():

                              if ":" not in line:
                                  continue

                              key, value = line.split(
                                  ":",
                                  1
                              )

                              key = key.strip()
                              value = value.strip()

                              value = value.strip("\"'")

                              if key == "title":
                                  title = value

                              elif key == "date":
                                  date = value

                              elif key == "category":
                                  category = value


                  # 文件名就是文章 slug
                  slug = file.stem

                  posts.append({
                      "slug": slug,
                      "filename": file.name,
                      "title": title or slug,
                      "date": date or slug,
                      "category": category or "未分类",
                      "body": body
                  })


          # 按日期从新到旧排列
          posts.sort(
              key=lambda post: post["date"],
              reverse=True
          )


          # 生成 posts.json
          output_file.write_text(
              json.dumps(
                  posts,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          print(
              f"Generated posts.json with {len(posts)} posts."
          )

          for post in posts:
              print(
                  post["slug"],
                  post["title"]
              )
          PY

      - name: Commit posts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json

          if git diff --cached --quiet; then
            echo "No changes to posts.json"
          else
            git commit -m "build: update posts.json"
            git push
          fi
