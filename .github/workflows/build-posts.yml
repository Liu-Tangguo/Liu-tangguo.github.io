name: Build Posts JSON

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - ".github/workflows/build-posts.yml"
      - ".github/scripts/build-data.py"
      - "index.html"
      - "post.html"
      - ".pages.yml"

  schedule:
    - cron: "0 22 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-posts:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Build data JSON
        run: python3 .github/scripts/build-data.py


      - name: Commit generated JSON
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json notices.json updates.json projects.json site.json contributions.json

          if git diff --cached --quiet; then

            echo "No changes to generated JSON"

          else

            git commit -m "build: update generated JSON"

            git push

          fi
