<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在跳转… · Tangguo的Blog</title>
<meta name="robots" content="noindex,follow">
<meta name="color-scheme" content="light dark">
<script>
/* 兼容旧链接：post.html?post=<slug> → p/<slug>/ */
(function(){
  var s='';
  try{ s=String(new URLSearchParams(location.search).get('post')||'').trim(); }catch(e){}
  location.replace(s ? ('p/'+encodeURIComponent(s)+'/') : 'index.html');
})();
</script>
<style>body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#1d1d1f;display:flex;align-items:center;justify-content:center;height:100vh}a{color:#0071e3}</style>
</head>
<body>
<noscript><p>正在跳转…… 如果浏览器没有自动跳转，请<a href="index.html">返回首页</a>。</p></noscript>
</body>
</html>
