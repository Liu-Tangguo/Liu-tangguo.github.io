<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>文章详情 - 我的个人网站</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #eeeeee;

            color: #333;

            font-family:
                "Microsoft YaHei",
                "SimSun",
                Arial,
                sans-serif;

            font-size: 14px;

        }


        a {

            color: #8b0000;

            text-decoration: none;

        }


        a:hover {

            text-decoration: underline;

        }


        /* =========================
           顶部
        ========================= */

        .topbar {

            background: #7b0000;

            color: white;

            border-bottom:
                4px solid #d6b36a;

        }


        .topbar-inner {

            max-width: 1200px;

            margin: 0 auto;

            padding: 8px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .site-name {

            font-size: 20px;

            font-weight: bold;

        }


        .site-info {

            font-size: 12px;

        }


        /* =========================
           主体
        ========================= */

        .container {

            max-width: 1200px;

            margin: 15px auto;

            padding: 0 15px;

        }


        /* =========================
           导航
        ========================= */

        .nav {

            background: #f8f8f8;

            border: 1px solid #ccc;

            margin-bottom: 15px;

        }


        .nav-inner {

            display: flex;

            flex-wrap: wrap;

        }


        .nav a {

            display: block;

            padding: 10px 18px;

            border-right:
                1px solid #ddd;

            color: #333;

            font-weight: bold;

        }


        .nav a:hover {

            background: #7b0000;

            color: white;

            text-decoration: none;

        }


        /* =========================
           文章
        ========================= */

        .article-box {

            background: white;

            border: 1px solid #ccc;

            box-shadow:
                0 1px 2px
                rgba(0, 0, 0, 0.05);

        }


        .article-header {

            background: #f5f5f5;

            border-bottom:
                1px solid #ccc;

            padding: 20px 25px;

        }


        .article-title {

            margin:
                0 0 12px;

            color: #7b0000;

            font-size: 26px;

            line-height: 1.5;

        }


        .article-meta {

            color: #777;

            font-size: 13px;

        }


        .article-meta span {

            margin-right: 20px;

        }


        .article-body {

            padding: 30px 35px;

            line-height: 1.9;

            font-size: 16px;

            min-height: 300px;

        }


        .article-body h1,
        .article-body h2,
        .article-body h3 {

            color: #7b0000;

            border-left:
                5px solid #7b0000;

            padding-left: 10px;

        }


        .article-body p {

            margin: 15px 0;

        }


        .article-body ul,
        .article-body ol {

            padding-left: 30px;

        }


        .article-body blockquote {

            margin: 20px 0;

            padding: 10px 15px;

            background: #f5f5f5;

            border-left:
                4px solid #999;

            color: #666;

        }


        .article-body code {

            background: #f1f1f1;

            padding: 2px 5px;

            border: 1px solid #ddd;

            font-family:
                Consolas,
                monospace;

        }


        .article-body pre {

            background: #272822;

            color: #eee;

            padding: 15px;

            overflow-x: auto;

            border-radius: 2px;

        }


        .article-body pre code {

            background: transparent;

            border: none;

            padding: 0;

            color: inherit;

        }


        .article-body img {

            max-width: 100%;

            height: auto;

        }


        /* =========================
           底部按钮
        ========================= */

        .article-footer {

            padding: 15px 25px;

            border-top:
                1px solid #ddd;

            background: #fafafa;

        }


        .back-button {

            display: inline-block;

            padding: 7px 15px;

            background: #7b0000;

            color: white;

            border:
                1px solid #600000;

        }


        .back-button:hover {

            background: #a00000;

            text-decoration: none;

        }


        /* =========================
           信息
        ========================= */

        .message {

            padding: 60px 20px;

            text-align: center;

            color: #777;

            white-space: pre-line;

        }


        .message h2 {

            color: #8b0000;

        }


        .error {

            color: #8b0000;

        }


        /* =========================
           页脚
        ========================= */

        footer {

            margin-top: 20px;

            padding: 20px;

            background: #ddd;

            border-top:
                3px solid #7b0000;

            text-align: center;

            color: #666;

            font-size: 12px;

            line-height: 1.8;

        }


        /* =========================
           手机端
        ========================= */

        @media (max-width: 700px) {

            .topbar-inner {

                display: block;

            }


            .site-info {

                margin-top: 5px;

            }


            .nav-inner {

                display: block;

            }


            .nav a {

                border-right: none;

                border-bottom:
                    1px solid #ddd;

            }


            .article-title {

                font-size: 22px;

            }


            .article-body {

                padding: 20px;

                font-size: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         顶部
    ========================== -->

    <div class="topbar">

        <div class="topbar-inner">


            <div class="site-name">

                我的个人网站

            </div>


            <div class="site-info">

                <span id="today">
                    正在获取日期...
                </span>

                ｜本站已运行

                <span id="run-days">
                    0
                </span>

                天

            </div>


        </div>

    </div>



    <!-- =========================
         主体
    ========================== -->

    <div class="container">


        <!-- 导航 -->

        <div class="nav">

            <div class="nav-inner">


                <a href="index.html">

                    首页

                </a>


                <a href="index.html#articles">

                    文章

                </a>


                <a href="index.html#about">

                    关于本站

                </a>


            </div>

        </div>



        <!-- 文章 -->

        <div class="article-box">

            <div id="article">

                <div class="message">

                    正在读取文章，请稍候……

                </div>

            </div>

        </div>


    </div>



    <!-- =========================
         页脚
    ========================== -->

    <footer>

        <div>

            我的个人网站

        </div>


        <div>

            建站日期：2026-09-26

        </div>


        <div id="footer-date">

            2026-09-26

        </div>

    </footer>



<script>
(function(){
  var START_DATE = '2026-09-26';
  var POSTS_JSON = 'posts.json';
  var BT = String.fromCharCode(96);
  var FENCE = BT + BT + BT;

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }

  /* ---------- 日期与运行天数 ---------- */
  (function(){
    var now = new Date();
    var y = now.getFullYear(), m = pad(now.getMonth()+1), d = pad(now.getDate());
    var wd = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
    var t = document.getElementById('today'); if(t) t.textContent = y+'-'+m+'-'+d+' '+wd;
    var fd = document.getElementById('footer-date'); if(fd) fd.textContent = y+'-'+m+'-'+d;
    var rd = document.getElementById('run-days');
    if(rd){
      var start = new Date(START_DATE+'T00:00:00');
      var today = new Date(y+'-'+m+'-'+d+'T00:00:00');
      rd.textContent = Math.max(0, Math.floor((today-start)/86400000));
    }
  })();

  /* ---------- 行内格式（先转义再套标记） ---------- */
  function inline(s){
    var t = esc(s);
    if(t.indexOf(BT) > -1){
      var parts = t.split(BT);
      for(var i=1;i<parts.length;i+=2){ parts[i] = '<code>'+parts[i]+'</code>'; }
      t = parts.join('');
    }
    t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    return t;
  }

  /* ---------- Markdown → HTML（逐行解析，替代原来的贪婪正则） ---------- */
  function mdToHtml(md){
    if(!md) return '';
    var lines = String(md).replace(/\r\n?/g,'\n').split('\n');
    var out = [], buf = [], mode = '', code = [], inCode = false;

    function flush(){
      if(!buf.length){ mode = ''; return; }
      if(mode==='ul') out.push('<ul>'+buf.join('')+'</ul>');
      else if(mode==='ol') out.push('<ol>'+buf.join('')+'</ol>');
      else if(mode==='quote') out.push('<blockquote>'+buf.join('<br>')+'</blockquote>');
      else out.push('<p>'+buf.join('<br>')+'</p>');
      buf = []; mode = '';
    }

    for(var i=0;i<lines.length;i++){
      var raw = lines[i];
      var line = raw.replace(/\s+$/,'');
      if(line.indexOf(FENCE) > -1){
        if(inCode){ out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>'); code = []; inCode = false; }
        else { flush(); inCode = true; }
        continue;
      }
      if(inCode){ code.push(raw); continue; }
      if(line.trim()===''){ flush(); continue; }
      var m, t = line.trim();
      if((m = /^(#{1,6})\s*(.*)$/.exec(t))){ flush(); var lv = m[1].length; out.push('<h'+lv+'>'+inline(m[2])+'</h'+lv+'>'); continue; }
      if((m = /^>\s?(.*)$/.exec(t))){ if(mode!=='quote'){ flush(); mode='quote'; } buf.push(inline(m[1])); continue; }
      if((m = /^[-*+]\s+(.*)$/.exec(t))){ if(mode!=='ul'){ flush(); mode='ul'; } buf.push('<li>'+inline(m[1])+'</li>'); continue; }
      if((m = /^\d+[.)]\s+(.*)$/.exec(t))){ if(mode!=='ol'){ flush(); mode='ol'; } buf.push('<li>'+inline(m[1])+'</li>'); continue; }
      if(/^([-*_]\s*){3,}$/.test(t)){ flush(); out.push('<hr>'); continue; }
      if(mode!=='p'){ flush(); mode='p'; }
      buf.push(inline(t));
    }
    if(inCode && code.length){ out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>'); }
    flush();
    return out.join('\n');
  }

  /* ---------- 渲染文章 ---------- */
  function showArticle(article){
    var box = document.getElementById('article');
    if(!box) return;
    document.title = (article.title || '文章') + ' - 个人博客';
    box.innerHTML =
      '<div class="article-header">' +
        '<h1 class="article-title">' + esc(article.title || '无标题') + '</h1>' +
        '<div class="article-meta">' +
          '<span>日期：' + esc(article.date || '未知') + '</span>' +
          '<span>分类：' + esc(article.category || '未分类') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="article-body">' + mdToHtml(article.body || '') + '</div>' +
      '<div class="article-footer"><a class="back-button" href="index.html">← 返回首页</a></div>';
  }

  function showError(message){
    var box = document.getElementById('article');
    if(!box) return;
    box.innerHTML =
      '<div class="message error">' +
        '<h2>文章读取失败</h2>' +
        '<p>' + esc(message).replace(/\n/g,'<br>') + '</p>' +
        '<p><a href="index.html">返回首页</a></p>' +
      '</div>';
  }

  /* ---------- 读取文章 ---------- */
  function loadArticle(){
    var slug = '';
    try {
      slug = String(new URLSearchParams(window.location.search).get('post') || '').trim();
    } catch(e){ slug = ''; }

    fetch(POSTS_JSON + '?v=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('posts.json 加载失败，HTTP ' + r.status); return r.json(); })
      .then(function(posts){
        if(!Array.isArray(posts)) throw new Error('posts.json 格式不正确。');
        posts = posts.filter(function(p){ return p && p.slug; });

        var found = null;
        if(slug){
          for(var i=0;i<posts.length;i++){ if(String(posts[i].slug).trim() === slug){ found = posts[i]; break; } }
          if(!found){
            var names = posts.map(function(p){ return String(p.slug); });
            showError('找不到文章：' + slug + '\n\n当前可用的文章：\n' + (names.length ? names.join('\n') : '（还没有文章）'));
            return;
          }
        } else {
          posts.sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
          found = posts[0];
          if(!found){ showError('还没有任何文章。'); return; }
        }
        showArticle(found);
      })
      .catch(function(e){
        console.error(e);
        showError(e && e.message ? e.message : '读取文章时发生未知错误。');
      });
  }

  loadArticle();
})();
</script>


</body>

</html>
