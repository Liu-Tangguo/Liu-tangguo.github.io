<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章详情 · Tangguo的Blog</title>
<meta name="color-scheme" content="light dark">
<style>
/* 与首页同一套苹果语言：大标题、粗体对比、蓝色链接、极简边框；零外部依赖 */
:root{
  --black:#000; --white:#fff; --gray:#f5f5f7;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
  --line:rgba(0,0,0,.08);
  --blue:#0071e3; --blue-h:#0077ed; --link:#0066cc;
  --sans:-apple-system,"SF Pro Display","SF Pro SC","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--white);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;letter-spacing:.011em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;transition:color .2s var(--ease)}
a:hover{color:var(--link)}
img{max-width:100%;height:auto}
::selection{background:var(--blue);color:#fff}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}

/* ---------- 导航 ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.72);border-bottom:1px solid var(--line);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.topbar-inner{max-width:1040px;margin:0 auto;padding:0 22px;height:48px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.site-name{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.site-name img{width:26px;height:26px;border-radius:8px;display:block;flex:0 0 auto}
.site-name:hover{color:var(--link)}
.site-info{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 文章 ---------- */
.container{max-width:1040px;margin:0 auto;padding:52px 22px 80px}
.crumb-line{margin-bottom:26px}
.crumb-line a{font-size:14px;color:var(--link)}
.article-box{max-width:740px;margin:0 auto}
.article-header{padding-bottom:28px;border-bottom:1px solid var(--line)}
.article-title{font-size:clamp(30px,4vw,48px);font-weight:600;letter-spacing:-.016em;line-height:1.1}
.article-meta{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--ink-3)}
.article-meta span{white-space:nowrap}
.article-body{padding-top:34px;font-size:17px;line-height:1.68;color:var(--ink)}
.article-body>*+*{margin-top:22px}
.article-body h1{font-size:32px;margin-top:44px}
.article-body h2{font-size:26px;margin-top:44px;letter-spacing:-.012em}
.article-body h3{font-size:21px;margin-top:34px}
.article-body h4{font-size:18px;margin-top:28px}
.article-body p{margin-top:22px}
.article-body ul,.article-body ol{margin-top:22px;padding-left:26px}
.article-body ul{list-style:none}
.article-body ul li{position:relative;padding-left:20px;margin-top:8px}
.article-body ul li::before{content:"";position:absolute;left:0;top:.68em;width:6px;height:6px;border-radius:980px;background:var(--ink-3)}
.article-body ol{list-style:decimal}
.article-body ol li{margin-top:8px}
.article-body blockquote{
  margin-top:28px;padding:4px 0 4px 24px;border-left:3px solid var(--blue);
  color:var(--ink-2);font-size:19px;line-height:1.5
}
.article-body code{font-family:var(--mono);font-size:.88em;background:var(--gray);padding:3px 7px;border-radius:6px}
.article-body pre{background:var(--gray);padding:22px;border-radius:14px;overflow-x:auto;font-size:14px;line-height:1.6;margin-top:28px}
.article-body pre code{background:none;padding:0;font-size:inherit}
.article-body hr{border:0;border-top:1px solid var(--line);margin:40px 0}
.article-body img{border-radius:14px;margin:28px 0}
.article-body a{color:var(--link)}
.article-body a:hover{text-decoration:underline}
.article-footer{margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.back-button{display:inline-block;font-size:16px;line-height:1;padding:13px 24px;border-radius:980px;background:var(--blue);color:#fff;transition:background .2s var(--ease)}
.back-button:hover{background:var(--blue-h);color:#fff}

/* ---------- 状态 ---------- */
.message{padding:90px 20px;text-align:center;color:var(--ink-2);white-space:pre-line;font-size:16px}
.message.error h2{font-size:24px;color:var(--ink);margin-bottom:14px}
.message a{color:var(--link)}

/* ---------- 页脚 ---------- */
footer{background:var(--white);color:var(--ink-2);font-size:12px;padding:36px 0 30px;line-height:1.7;border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* ---------- 动效 ---------- */
@keyframes ocUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ocFade{from{opacity:0}to{opacity:1}}
.back-button{transition:background .25s var(--ease),transform .18s var(--ease)}
.back-button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){
  body{font-size:16px}
  .container{padding:32px 16px 60px}
  .article-body{font-size:16px}
  .topbar-inner{padding:0 16px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="site-name" href="index.html"><img src="media/logo.svg" alt="" width="26" height="26"><span>Tangguo的Blog</span></a>
    <div class="site-info"><span id="today">正在获取日期...</span> ｜ 本站已运行 <span id="run-days">0</span> 天</div>
  </div>
</div>

<div class="container">
  <p class="crumb-line"><a href="index.html">‹ 返回首页</a></p>
  <div class="article-box">
    <div id="article">
      <div class="message">正在读取文章，请稍候……</div>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">
    <span>Tangguo的Blog</span>
    <span>建站日期：2026-09-26</span>
    <span id="footer-date">2026-09-26</span>
  </div>
</footer>

<script>
(function(){
  var START_DATE = '2026-09-26';
  var POSTS_JSON = 'posts.json';
  var BT = String.fromCharCode(96);
  var FENCE = BT + BT + BT;

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }

  /* ---------- 日期与运行天数 ---------- */
  (function(){
    var now = new Date();
    var y = now.getFullYear(), m = pad(now.getMonth()+1), d = pad(now.getDate());
    var wd = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
    var t = document.getElementById('today'); if(t) t.textContent = y+'-'+m+'-'+d+' '+wd;
    var fd = document.getElementById('footer-date'); if(fd) fd.textContent = y+'-'+m+'-'+d;
    var rd = document.getElementById('run-days');
    if(rd){
      var start = new Date(START_DATE+'T00:00:00');
      var today = new Date(y+'-'+m+'-'+d+'T00:00:00');
      rd.textContent = Math.max(0, Math.floor((today-start)/86400000));
    }
  })();

  /* ---------- 行内格式（先转义再套标记） ---------- */
  function inline(s){
    var t = esc(s);
    if(t.indexOf(BT) > -1){
      var parts = t.split(BT);
      for(var i=1;i<parts.length;i+=2){ parts[i] = '<code>'+parts[i]+'</code>'; }
      t = parts.join('');
    }
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, function(_, alt, url){
      return '<img src="' + url + '" alt="' + alt + '" loading="lazy" style="max-width:100%;height:auto;border-radius:2px;margin:8px 0">';
    });
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, function(_, txt, url){
      return '<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>';
    });
    t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    return t;
  }

  /* ---------- Markdown → HTML（逐行解析，替代原来的贪婪正则） ---------- */
  function mdToHtml(md){
    if(!md) return '';
    var lines = String(md).replace(/\r\n?/g,'\n').split('\n');
    var out = [], buf = [], mode = '', code = [], inCode = false;

    function flush(){
      if(!buf.length){ mode = ''; return; }
      if(mode==='ul') out.push('<ul>'+buf.join('')+'</ul>');
      else if(mode==='ol') out.push('<ol>'+buf.join('')+'</ol>');
      else if(mode==='quote') out.push('<blockquote>'+buf.join('<br>')+'</blockquote>');
      else out.push('<p>'+buf.join('<br>')+'</p>');
      buf = []; mode = '';
    }

    for(var i=0;i<lines.length;i++){
      var raw = lines[i];
      var line = raw.replace(/\s+$/,'');
      if(line.indexOf(FENCE) > -1){
        if(inCode){ out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>'); code = []; inCode = false; }
        else { flush(); inCode = true; }
        continue;
      }
      if(inCode){ code.push(raw); continue; }
      if(line.trim()===''){ flush(); continue; }
      var m, t = line.trim();
      if((m = /^(#{1,6})\s*(.*)$/.exec(t))){ flush(); var lv = m[1].length; out.push('<h'+lv+'>'+inline(m[2])+'</h'+lv+'>'); continue; }
      if((m = /^>\s?(.*)$/.exec(t))){ if(mode!=='quote'){ flush(); mode='quote'; } buf.push(inline(m[1])); continue; }
      if((m = /^[-*+]\s+(.*)$/.exec(t))){ if(mode!=='ul'){ flush(); mode='ul'; } buf.push('<li>'+inline(m[1])+'</li>'); continue; }
      if((m = /^\d+[.)]\s+(.*)$/.exec(t))){ if(mode!=='ol'){ flush(); mode='ol'; } buf.push('<li>'+inline(m[1])+'</li>'); continue; }
      if(/^([-*_]\s*){3,}$/.test(t)){ flush(); out.push('<hr>'); continue; }
      if(mode!=='p'){ flush(); mode='p'; }
      buf.push(inline(t));
    }
    if(inCode && code.length){ out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>'); }
    flush();
    return out.join('\n');
  }

  /* ---------- 渲染文章 ---------- */
  function showArticle(article){
    var box = document.getElementById('article');
    if(!box) return;
    document.title = (article.title || '文章') + ' - Tangguo的Blog';
    box.innerHTML =
      '<div class="article-header">' +
        '<h1 class="article-title">' + esc(article.title || '无标题') + '</h1>' +
        '<div class="article-meta">' +
          '<span>日期：' + esc(article.date || '未知') + '</span>' +
          '<span>分类：' + esc(article.category || '未分类') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="article-body">' + mdToHtml(article.body || '') + '</div>' +
      '<div class="article-footer"><a class="back-button" href="index.html">← 返回首页</a></div>';
  }

  function showError(message){
    var box = document.getElementById('article');
    if(!box) return;
    box.innerHTML =
      '<div class="message error">' +
        '<h2>文章读取失败</h2>' +
        '<p>' + esc(message).replace(/\n/g,'<br>') + '</p>' +
        '<p><a href="index.html">返回首页</a></p>' +
      '</div>';
  }

  /* ---------- 读取文章 ---------- */
  function loadArticle(){
    var slug = '';
    try {
      slug = String(new URLSearchParams(window.location.search).get('post') || '').trim();
    } catch(e){ slug = ''; }

    fetch(POSTS_JSON + '?v=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('posts.json 加载失败，HTTP ' + r.status); return r.json(); })
      .then(function(posts){
        if(!Array.isArray(posts)) throw new Error('posts.json 格式不正确。');
        posts = posts.filter(function(p){ return p && p.slug; });

        var found = null;
        if(slug){
          for(var i=0;i<posts.length;i++){ if(String(posts[i].slug).trim() === slug){ found = posts[i]; break; } }
          if(!found){
            var names = posts.map(function(p){ return String(p.slug); });
            showError('找不到文章：' + slug + '\n\n当前可用的文章：\n' + (names.length ? names.join('\n') : '（还没有文章）'));
            return;
          }
        } else {
          posts.sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
          found = posts[0];
          if(!found){ showError('还没有任何文章。'); return; }
        }
        showArticle(found);
      })
      .catch(function(e){
        console.error(e);
        showError(e && e.message ? e.message : '读取文章时发生未知错误。');
      });
  }

  loadArticle();
})();
</script>
</body>
</html>
